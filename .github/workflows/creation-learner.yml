name: Coding learner review
on:
  pull_request:
    paths:
      - 'src/creation/**'
      - 'src/drawing/**'
      - 'src/assets/private-drawings.ts'
      - 'public/art/creative-worlds/**'
      - 'scripts/connected-universe-browser.cjs'
      - 'tests/animation-editor-browser.cjs'
      - 'tests/creative-world-browser.cjs'
      - 'tests/drawing-animation.test.ts'
      - 'tools/creative-art-review/**'
      - 'tests/creative-art-game-browser.cjs'
      - 'tests/creation-learner*'
      - 'tests/pal-scene-image.test.ts'
      - 'src/pals/creation.ts'
      - '.github/workflows/creation-learner.yml'
      - 'package.json'
  push:
    branches: ['feature/coding-first-learner-overhaul-*']
concurrency:
  group: coding-learner-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  learner:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Build candidate
        id: build
        run: npm run build
      - name: Beginner coding and scene layout
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:creation-learner
      - name: Exact movement and Pal compositing contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --import tsx --test tests/creation-learner-controls.test.ts tests/pal-scene-image.test.ts tests/pals-creation.test.ts
      - name: Draw, animate, change worlds and reopen exact private versions
        run: |
          node --import tsx --test tests/drawing-animation.test.ts tests/creative-world-art.test.ts
          node tests/animation-editor-browser.cjs
          node tests/creative-world-browser.cjs
          node scripts/connected-universe-browser.cjs
      - name: Local-only generated module with a host-rendered synthetic sprite
        run: |
          npx --no-install vite build --mode creative-art-review --outDir test-results/creative-art-review
          node tests/creative-art-game-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-creative-universe
          path: |
            test-results/connected-animation/
            test-results/connected-universe/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coding-learner-evidence
          path: test-results/creation-learner-*
          if-no-files-found: warn
