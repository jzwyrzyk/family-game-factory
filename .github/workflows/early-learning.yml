name: Early learning preview
on:
  pull_request:
    paths:
      - 'src/learning/**'
      - 'src/language/**'
      - 'src/creation/**'
      - 'src/studio/**'
      - 'src/legacy/**'
      - 'src/builder/**'
      - 'src/parent/**'
      - 'src/storage/**'
      - 'server/beta/**'
      - 'scripts/beta/**'
      - 'src/speech/**'
      - 'public/early-pictures/**'
      - 'tests/early-*'
      - 'tests/browser-server.cjs'
      - 'tools/offline-build.ts'
      - '.github/workflows/early-learning.yml'
permissions:
  contents: read
concurrency:
  group: early-learning-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  synthetic-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:early-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: early-learning-browser
          path: test-results/early-journey/*.png
