name: Jems Game Intelligence contracts
on:
  pull_request:
    paths:
      - '.github/workflows/game-intelligence-contracts.yml'
      - 'server/quality/**'
      - 'server/agent/openai.ts'
      - 'server/agent/model-policy.ts'
      - 'server/agent/generation-contract.ts'
      - 'server/agent/premium-production.ts'
      - 'tools/premium-*.ts'
      - 'tools/premium-art/**'
      - 'server/agent/sprite-sheet.ts'
      - 'server/agent/illustrations.ts'
      - 'tests/premium-*'
      - 'server/sandbox/intent-playtest-v2.cjs'
      - 'server/sandbox/playtest-v2.cjs'
      - 'server/sandbox/worker.cjs'
      - 'server/sandbox/docker-gate.ts'
      - 'server/actions/coordinator.ts'
      - 'server/actions/worker-cli.ts'
      - 'server/pipeline/**'
      - 'tests/game-form.test.ts'
      - 'tests/child-intent.test.ts'
      - 'tests/game-intelligence.test.ts'
      - 'tests/working-game-contract.test.ts'
      - 'tests/intent-repair.test.ts'
      - 'tests/intent-worker-binding.test.ts'
      - 'tests/intent-playtest-browser.ts'
      - 'tests/private-generation-preflight.test.ts'
      - 'tests/unit.ts'
  push:
    branches:
      - main
      - 'research/game-intelligence-*'
    paths:
      - '.github/workflows/game-intelligence-contracts.yml'
      - 'server/quality/**'
      - 'server/agent/openai.ts'
      - 'server/agent/model-policy.ts'
      - 'server/agent/generation-contract.ts'
      - 'server/agent/premium-production.ts'
      - 'tools/premium-*.ts'
      - 'tools/premium-art/**'
      - 'server/agent/sprite-sheet.ts'
      - 'server/agent/illustrations.ts'
      - 'tests/premium-*'
      - 'server/actions/coordinator.ts'
      - 'server/actions/worker-cli.ts'
      - 'server/pipeline/**'
      - 'tests/game-form.test.ts'
      - 'tests/child-intent.test.ts'
      - 'tests/game-intelligence.test.ts'
      - 'tests/working-game-contract.test.ts'
      - 'tests/intent-repair.test.ts'
      - 'tests/private-generation-preflight.test.ts'
      - 'tests/unit.ts'
permissions:
  contents: read
concurrency:
  group: jems-intelligence-contracts-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Entire unit and contract suite
        run: npm run test:unit
      - name: Premium policies and offline comparison harness
        run: npm run test:premium
      - name: Produce offline paired benchmark manifest
        run: npm run --silent benchmark:premium > premium-benchmark.json
      - name: Exercise seven matched concepts and both policy routes offline
        run: npm run --silent benchmark:premium -- --mock > premium-mock.json
      - uses: actions/upload-artifact@v4
        with:
          name: premium-offline-comparison
          path: |
            premium-benchmark.json
            premium-mock.json
# This workflow has no browser installer, privileged credentials, paid calls,
# deployment permissions or worker trust configuration. Full Arcade/creative/
# learning/visual and private-runner security gates remain separate and mandatory.
