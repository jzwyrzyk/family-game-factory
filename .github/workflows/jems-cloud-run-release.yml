name: Jems Cloud Run release
on:
  push:
    branches: [main]
    paths: ['ops/release.json']
  workflow_dispatch:
    inputs:
      verify_identity:
        description: Verify GitHub OIDC claims only while production flags are off
        type: boolean
        default: false
      verify_access:
        description: Read-only federated access proof after reviewed flag-absence check
        type: boolean
        default: false
      observe:
        description: Read current service metadata only; never plan or apply a transition
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: jems-cloud-run-production
  cancel-in-progress: false

jobs:
  verify-identity:
    if: >-
      github.repository == 'jzwyrzyk/family-game-factory' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      inputs.verify_identity && !inputs.verify_access && !inputs.observe &&
      vars.JEMS_IMAGE_PUBLISH_ENABLED != 'true' &&
      vars.JEMS_CLOUD_RUN_RELEASE_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: jems-cloud-run-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/ops/oidc_claims.py release
  verify-access:
    if: >-
      github.repository == 'jzwyrzyk/family-game-factory' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      inputs.verify_access && !inputs.verify_identity && !inputs.observe &&
      vars.JEMS_IMAGE_PUBLISH_ENABLED == '' &&
      vars.JEMS_CLOUD_RUN_RELEASE_ENABLED == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: jems-cloud-run-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: access-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.JEMS_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.JEMS_RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/userinfo.email
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify federated production access
        env:
          JEMS_GOOGLE_ACCESS_TOKEN: ${{ steps.access-auth.outputs.access_token }}
          JEMS_ACCESS_PROVIDER: ${{ vars.JEMS_RELEASE_WIF_PROVIDER }}
          JEMS_ACCESS_SERVICE_ACCOUNT: ${{ vars.JEMS_RELEASE_SERVICE_ACCOUNT }}
          JEMS_VERIFY_ACCESS: ${{ inputs.verify_access }}
          JEMS_VERIFY_IDENTITY: ${{ inputs.verify_identity }}
          JEMS_IMAGE_PUBLISH_ENABLED: ${{ vars.JEMS_IMAGE_PUBLISH_ENABLED }}
          JEMS_CLOUD_RUN_RELEASE_ENABLED: ${{ vars.JEMS_CLOUD_RUN_RELEASE_ENABLED }}
        run: python3 scripts/ops/verify_release_access.py release
  observe:
    if: >-
      github.repository == 'jzwyrzyk/family-game-factory' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      inputs.observe && !inputs.verify_identity && !inputs.verify_access &&
      vars.JEMS_CLOUD_RUN_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: jems-cloud-run-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: observe-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.JEMS_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.JEMS_RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/userinfo.email
          create_credentials_file: false
          export_environment_variables: false
      - name: Read current release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: ''
          GH_PROMPT_DISABLED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          JEMS_GOOGLE_ACCESS_TOKEN: ${{ steps.observe-auth.outputs.access_token }}
          JEMS_ACCESS_PROVIDER: ${{ vars.JEMS_RELEASE_WIF_PROVIDER }}
          JEMS_ACCESS_SERVICE_ACCOUNT: ${{ vars.JEMS_RELEASE_SERVICE_ACCOUNT }}
          JEMS_OBSERVE: ${{ inputs.observe }}
          JEMS_VERIFY_ACCESS: ${{ inputs.verify_access }}
          JEMS_VERIFY_IDENTITY: ${{ inputs.verify_identity }}
          JEMS_CLOUD_RUN_RELEASE_ENABLED: ${{ vars.JEMS_CLOUD_RUN_RELEASE_ENABLED }}
        run: python3 scripts/ops/observe_release.py
  plan:
    if: github.repository == 'jzwyrzyk/family-game-factory' && github.ref == 'refs/heads/main' && github.ref_protected && !inputs.verify_identity && !inputs.verify_access && !inputs.observe
    runs-on: ubuntu-24.04
    outputs:
      operation: ${{ steps.plan.outputs.operation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate reviewed intent and source
        id: intent
        run: |
          set -euo pipefail
          if jq -e '. == {}' ops/release.json >/dev/null; then exit 0; fi
          plan="$(python3 scripts/ops/release.py ops/release.json | jq -ce .)"
          source="$(jq -er .source <<<"$plan")"
          operation="$(jq -er .operation <<<"$plan")"
          git merge-base --is-ancestor "$source" HEAD
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          if [[ "$operation" != rollback ]]; then
            evidence="$(jq -er '.evidence | split("/") | last' ops/compatibility.json)"
            echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
          fi
      # Rollback retains its existing independence from application CI, including
      # avoiding a new Node setup dependency when recovering traffic.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.intent.outputs.operation != '' && steps.intent.outputs.operation != 'rollback'
        with:
          node-version: 22
      - name: Require complete source-bound validation before release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ steps.intent.outputs.source }}
          RELEASE_OPERATION: ${{ steps.intent.outputs.operation }}
          RELEASE_EVIDENCE: ${{ steps.intent.outputs.evidence }}
          RELEASE_PLAN: ${{ steps.intent.outputs.plan }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_OPERATION" ]]; then exit 0; fi
          if [[ "$RELEASE_OPERATION" != rollback ]]; then
            node scripts/ci/verify-release-validation.mjs "$RELEASE_SOURCE" "$RELEASE_EVIDENCE" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "operation=$RELEASE_OPERATION" >> "$GITHUB_OUTPUT"
          echo "$RELEASE_PLAN" >> "$GITHUB_STEP_SUMMARY"
  transition:
    needs: plan
    if: needs.plan.outputs.operation != '' && vars.JEMS_CLOUD_RUN_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: jems-cloud-run-production
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.JEMS_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.JEMS_RELEASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Verify signed image provenance
        if: needs.plan.outputs.operation != 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="$(jq -er .image ops/release.json)"
          source="$(jq -er .source ops/release.json)"
          gcloud auth configure-docker us-east5-docker.pkg.dev --quiet
          gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/jems-service-images.yml" \
            --source-ref refs/heads/main --source-digest "$source" --deny-self-hosted-runners
      - name: Check current main and execute reviewed transition
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python3 scripts/ops/release.py ops/release.json --apply | tee -a "$GITHUB_STEP_SUMMARY"
