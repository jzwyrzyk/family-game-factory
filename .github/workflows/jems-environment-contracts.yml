name: Jems environment contracts
on:
  push:
    branches: [main]
    paths: ['scripts/environments/**', 'scripts/beta/**', 'scripts/ops/integrated_test_stack.py', '.github/actions/integrated-test/**', 'tests/test_environment_*.py', 'tests/environments/**', 'infra/nonproduction/**', 'ops/environments.json', '.github/workflows/jems-*', 'package.json']
  pull_request:
    paths: ['scripts/environments/**', 'scripts/beta/**', 'scripts/ops/integrated_test_stack.py', '.github/actions/integrated-test/**', 'tests/test_environment_*.py', 'tests/environments/**', 'infra/nonproduction/**', 'ops/environments.json', '.github/workflows/jems-*', 'package.json']
permissions:
  contents: read
concurrency:
  group: jems-environment-contracts-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: python3 -m unittest discover -s tests -p 'test_environment_*.py'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/environments/*.test.cjs
      - name: Check TEST-only premium admission and ledger settlement
        run: node --import tsx --test tests/environments/test-trial.test.ts
      - name: Validate and rehearse the pinned TEST Terraform without credentials
        shell: bash
        run: |
          set -euo pipefail
          local_tools="$RUNNER_TEMP/test-terraform-cli"
          mkdir "$local_tools"
          archive="$local_tools/terraform.zip"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://releases.hashicorp.com/terraform/1.13.5/terraform_1.13.5_linux_amd64.zip -o "$archive"
          printf '%s  %s\n' 0dbe3fcc268eb670801af6a6456799d1ae26e72e73797f6c6167e18aafd1fd9a "$archive" | sha256sum --check --status
          unzip -q "$archive" terraform -d "$local_tools"
          root=infra/nonproduction/family-beta/terraform
          "$local_tools/terraform" -chdir="$root" init -backend=false -input=false -lockfile=readonly
          "$local_tools/terraform" -chdir="$root" fmt -check -recursive
          "$local_tools/terraform" -chdir="$root" validate
          "$local_tools/terraform" -chdir="$root" test -no-color
      - name: Existing complete regression partition remains intact
        run: python3 scripts/deployment/regressions.py --check
