name: Jems private environments
on:
  workflow_run:
    workflows: ['Jems preview bundle', 'Arcade journeys', 'Documentation context', 'Jems operations contracts']
    types: [completed]
  workflow_dispatch:
    inputs:
      family_beta:
        description: Optional authenticated family candidate operation in an existing nonproduction environment
        type: choice
        options: ['off', verify, stage, prepare-uat, qualify-fixture, uat, live-uat]
        default: 'off'
      family_stage:
        description: Existing private family environment
        type: choice
        options: [dev, test]
        default: dev
      family_source:
        description: Full reviewed application commit for the private family operation
        type: string
        required: false
      run_id:
        description: Successful source workflow run to reconcile; empty means cleanup only
        required: false
        type: string
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
concurrency:
  group: jems-nonproduction-controller
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'jzwyrzyk/family-game-factory' && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name != 'workflow_dispatch' || !inputs.family_beta || inputs.family_beta == 'off') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.prepare.outputs.enabled }}
      eligible: ${{ steps.prepare.outputs.eligible }}
      source: ${{ steps.prepare.outputs.source }}
      kind: ${{ steps.prepare.outputs.kind }}
      pr: ${{ steps.prepare.outputs.pr }}
      run: ${{ steps.prepare.outputs.run }}
      bundle: ${{ steps.prepare.outputs.bundle }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/environments/
            /ops/environments.json
            /ops/github-main-ruleset.json
      - id: prepare
        name: Verify source, successful checks and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: python3 scripts/environments/automation.py prepare
      - name: Build fixed trusted server around validated data only
        if: steps.prepare.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          docker build --network none -t jems-site:ci "$RUNNER_TEMP/jems-context"
          docker save jems-site:ci | gzip -1 > "$RUNNER_TEMP/jems-site-image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.prepare.outputs.eligible == 'true'
        with:
          name: trusted-environment-image
          path: |
            ${{ runner.temp }}/jems-site-image.tar.gz
            ${{ runner.temp }}/jems-candidate.json
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: jems-nonproduction
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: write
      deployments: write
      issues: write
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      identity: ${{ steps.deploy.outputs.identity }}
      source: ${{ needs.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: trusted-environment-image
          path: ${{ runner.temp }}
      - name: Recheck current source before authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/environments/automation.py recheck
      - id: config
        run: python3 scripts/environments/automation.py config
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ steps.config.outputs.provider }}
          service_account: ${{ steps.config.outputs.deployer }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - id: deploy
        name: Publish immutable image and verify private service
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/environments/automation.py deploy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: environment-deployment-receipt
          path: ${{ runner.temp }}/jems-deployment.json
          if-no-files-found: ignore
          retention-days: 30

  deployed-browser:
    needs: deploy
    if: needs.deploy.outputs.url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: jems-nonproduction-uat
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - id: config
        run: python3 scripts/environments/automation.py config
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ steps.config.outputs.provider }}
          service_account: ${{ steps.config.outputs.uat }}
          token_format: id_token
          id_token_audience: ${{ steps.config.outputs.audience }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Test actual deployed disconnected application
        env:
          JEMS_UAT_BASE_URL: ${{ needs.deploy.outputs.url }}
          JEMS_UAT_ALLOWED_ORIGIN: ${{ needs.deploy.outputs.url }}
          JEMS_UAT_SOURCE_SHA: ${{ needs.deploy.outputs.source }}
          JEMS_UAT_MANIFEST_SHA256: ${{ needs.deploy.outputs.identity }}
          JEMS_UAT_IAP_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: node tests/environments/deployed-smoke.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deployed-browser-evidence
          path: test-results/environments/
          if-no-files-found: error
          retention-days: 14

  cleanup:
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_id == ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: jems-nonproduction
    permissions:
      contents: read
      pull-requests: read
      deployments: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: config
        run: python3 scripts/environments/automation.py config
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ steps.config.outputs.provider }}
          service_account: ${{ steps.config.outputs.deployer }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Reconcile closed or expired owned previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/environments/automation.py cleanup

  private-family-candidate:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'jzwyrzyk/family-game-factory' && github.ref == 'refs/heads/main' && github.ref_protected && (inputs.family_beta == 'verify' || inputs.family_beta == 'stage')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: jems-nonproduction
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    env:
      FAMILY_ENVIRONMENT: ${{ inputs.family_stage }}
      FAMILY_SOURCE: ${{ inputs.family_source }}
      FAMILY_OPERATION: ${{ inputs.family_beta }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: config
        name: Check the protected nonproduction controller configuration
        run: python3 scripts/environments/automation.py config
      - name: Verify the reviewed family candidate before cloud authentication
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RELEASE: ${{ inputs.family_stage == 'dev' && vars.JEMS_FAMILY_DEV_RELEASE || vars.JEMS_FAMILY_TEST_RELEASE }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, sys
          from pathlib import Path
          sys.path.insert(0,'scripts/environments')
          import ci_evidence, github
          source=os.environ['FAMILY_SOURCE']; stage=os.environ['FAMILY_ENVIRONMENT']
          assert re.fullmatch(r'[a-f0-9]{40}',source) and stage in ('dev','test')
          record=json.loads(os.environ['REVIEWED_RELEASE'])
          assert record['source']==source and record['descriptor']['environment']==stage
          api=github.GitHub()
          ci_evidence.verify_full_ci(api,source,stage,record.get('pr'))
          runs=api.request('repos/jzwyrzyk/family-game-factory/actions/workflows/trusted-device-security.yml/runs?head_sha='+source)['workflow_runs']
          eligible=[r for r in runs if r['head_sha']==source and r['event']==('pull_request' if stage=='dev' else 'push')]
          assert eligible and max(eligible,key=lambda r:r['id'])['conclusion']=='success'
          target=Path(os.environ['RUNNER_TEMP'])/'family-release.json';target.touch(mode=0o600,exist_ok=False);target.write_text(json.dumps(record))
          PYTHON
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ steps.config.outputs.provider }}
          service_account: ${{ steps.config.outputs.deployer }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Verify existing infrastructure or stage digest-pinned revisions at zero traffic
        run: node scripts/beta/environment-release.mjs "$RUNNER_TEMP/family-release.json" "$FAMILY_OPERATION" "$FAMILY_ENVIRONMENT" "$FAMILY_SOURCE" "$RUNNER_TEMP/family-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: family-candidate-${{ inputs.family_stage }}-${{ github.run_id }}
          path: ${{ runner.temp }}/family-receipt.json
          if-no-files-found: error
          retention-days: 14

  integrated-test-serving:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'jzwyrzyk/family-game-factory' && github.ref == 'refs/heads/main' && github.ref_protected && inputs.family_stage == 'test' && inputs.family_source == github.sha && contains(fromJSON('["prepare-uat","qualify-fixture","uat","live-uat"]'), inputs.family_beta)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: jems-nonproduction
    permissions: {contents: read, actions: read, checks: read, pull-requests: read, id-token: write}
    env:
      TEST_TARGET: ${{ vars.JEMS_TEST_UAT_TARGET }}
      TEST_COMPARISON_REVISIONS: ${{ vars.JEMS_TEST_COMPARISON_REVISIONS }}
      REVIEWED_RELEASE: ${{ vars.JEMS_FAMILY_TEST_RELEASE }}
      FAMILY_SOURCE: ${{ inputs.family_source }}
      FAMILY_OPERATION: ${{ inputs.family_beta }}
    outputs:
      audience: ${{ steps.preflight.outputs.audience }}
      provider: ${{ steps.config.outputs.provider }}
      uat: ${{ steps.config.outputs.uat }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - id: preflight
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 scripts/environments/test_target.py preflight
      - id: config
        run: python3 scripts/environments/automation.py config
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ steps.config.outputs.provider }}
          service_account: ${{ steps.config.outputs.deployer }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - run: |
          node scripts/beta/environment-release.mjs "$RUNNER_TEMP/test-reviewed.json" verify test "$FAMILY_SOURCE" "$RUNNER_TEMP/routing.json"
          python3 scripts/environments/test_target.py observe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-test-serving-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/test-serving.json
            ${{ runner.temp }}/test-configurations.json
          if-no-files-found: error
          retention-days: 30

  integrated-test-frontend:
    needs: integrated-test-serving
    if: inputs.family_beta == 'prepare-uat'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: jems-nonproduction-uat
    permissions: {contents: read, actions: read, id-token: write}
    env:
      TEST_TARGET: ${{ vars.JEMS_TEST_UAT_TARGET }}
      TEST_CONFIGURATION_PINS: ${{ vars.JEMS_TEST_REVIEWED_CONFIGURATIONS }}
      FAMILY_SOURCE: ${{ inputs.family_source }}
      FAMILY_OPERATION: ${{ inputs.family_beta }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: ./.github/actions/integrated-test
        with:
          provider: ${{ needs.integrated-test-serving.outputs.provider }}
          uat: ${{ needs.integrated-test-serving.outputs.uat }}
          audience: ${{ needs.integrated-test-serving.outputs.audience }}
          manifest: ${{ vars.JEMS_TEST_UAT_MANIFEST }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-test-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend.json
          if-no-files-found: error
          retention-days: 30

  integrated-test-uat:
    needs: integrated-test-serving
    if: inputs.family_beta == 'uat' || inputs.family_beta == 'qualify-fixture'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: jems-nonproduction-uat
    permissions: {contents: read, actions: read, id-token: write}
    env:
      PRIOR_FIXTURE_RUN: ${{ inputs.family_beta == 'uat' && vars.JEMS_TEST_PRIOR_FIXTURE_RUN || '' }}
      TEST_TARGET: ${{ vars.JEMS_TEST_UAT_TARGET }}
      TEST_CONFIGURATION_PINS: ${{ vars.JEMS_TEST_REVIEWED_CONFIGURATIONS }}
      FAMILY_SOURCE: ${{ inputs.family_source }}
      FAMILY_OPERATION: ${{ inputs.family_beta }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: ./.github/actions/integrated-test
        with:
          provider: ${{ needs.integrated-test-serving.outputs.provider }}
          uat: ${{ needs.integrated-test-serving.outputs.uat }}
          audience: ${{ needs.integrated-test-serving.outputs.audience }}
          manifest: ${{ vars.JEMS_TEST_UAT_MANIFEST }}
          credentials: ${{ secrets.JEMS_TEST_SYNTHETIC_DEVICES }}

      - name: Bind an unchanged protected fixture qualification
        if: env.PRIOR_FIXTURE_RUN != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 scripts/environments/test_fixture_reuse.py
      - name: Verify completed private runner identity and cleanup for each game version
        if: env.PRIOR_FIXTURE_RUN == ''
        env:
          GH_TOKEN: ${{ secrets.JEMS_TEST_WORKER_EVIDENCE_READ }}
        run: python3 scripts/environments/test_worker_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-test-${{ inputs.family_beta == 'qualify-fixture' && 'fixture' || 'uat' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 30

  integrated-test-live:
    needs: integrated-test-serving
    if: inputs.family_beta == 'live-uat'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: jems-nonproduction-uat
    permissions: {contents: read, actions: read, id-token: write}
    env:
      TEST_TARGET: ${{ vars.JEMS_TEST_UAT_TARGET }}
      TEST_CONFIGURATION_PINS: ${{ vars.JEMS_TEST_REVIEWED_CONFIGURATIONS }}
      FAMILY_SOURCE: ${{ inputs.family_source }}
      FAMILY_OPERATION: ${{ inputs.family_beta }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: ./.github/actions/integrated-test
        with:
          provider: ${{ needs.integrated-test-serving.outputs.provider }}
          uat: ${{ needs.integrated-test-serving.outputs.uat }}
          audience: ${{ needs.integrated-test-serving.outputs.audience }}
          manifest: ${{ vars.JEMS_TEST_UAT_MANIFEST }}
          credentials: ${{ secrets.JEMS_TEST_SYNTHETIC_DEVICES }}
          funding: ${{ vars.JEMS_TEST_TRIAL_AUTHORIZATION }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-test-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 30

  integrated-test-final-observation:
    needs: [integrated-test-serving, integrated-test-frontend, integrated-test-uat, integrated-test-live]
    if: always() && needs.integrated-test-serving.result == 'success' && contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: jems-nonproduction
    permissions: {contents: read, actions: read, id-token: write}
    env:
      TEST_TARGET: ${{ vars.JEMS_TEST_UAT_TARGET }}
      FAMILY_SOURCE: ${{ inputs.family_source }}
      FAMILY_OPERATION: ${{ inputs.family_beta }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-test-serving-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/original
      - id: config
        run: python3 scripts/environments/automation.py config
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ steps.config.outputs.provider }}
          service_account: ${{ steps.config.outputs.deployer }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - run: |
          python3 scripts/environments/test_target.py observe
          cmp "$RUNNER_TEMP/original/test-serving.json" "$RUNNER_TEMP/test-serving.json"
