name: Jems integration dependency snapshot
on:
  push:
    branches: [feature/jems-final-integration-20261118]
    paths: [.github/workflows/jems-integration-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Package pinned dependencies for review, no game execution
        run: tar czf review-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: jems-dependencies-review
          path: review-dependencies.tar.gz
          retention-days: 1
