name: Jems operations contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: jems-operations-contracts-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    name: Jems operations policy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/ops -p 'test_*.py' -v
        env:
          JEMS_OFFLINE_FIXTURE_DIR: ${{ runner.temp }}/jems-offline-fixture
      - name: Upload synthetic diagnostics fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jems-diagnostics-OFFLINE-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jems-offline-fixture/report.json
          if-no-files-found: error
          retention-days: 7
      - name: Boot both nonproduction drill images offline as non-root
        run: bash ops/drill/smoke.sh
      - name: Validate proposed release intent
        run: |
          if ! jq -e '. == {}' ops/release.json >/dev/null; then
            python3 scripts/ops/release.py ops/release.json
          fi
