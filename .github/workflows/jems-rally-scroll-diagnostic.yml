name: Synthetic fitted Rally WebKit diagnosis
on:
  push:
    branches: [audit/jems-learning-webkit-rally-27c28689]
permissions:
  contents: read
jobs:
  fitted-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        input: [locator, physical]
        notebook: ['0', '1']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: node scripts/storage/build-preview.mjs
      - name: Run two predeclared synthetic samples and retain each first failure
        env:
          RALLY_INPUT: ${{ matrix.input }}
          STUDIO_NOTEBOOK: ${{ matrix.notebook }}
          STORAGE_BROWSER: webkit
        shell: bash
        run: |
          result=0
          for sample in 1 2; do
            echo "Sample $sample"
            node tests/rally-scroll-diagnostic.cjs > "rally-sample-$sample.log" 2>&1 || result=1
            cat "rally-sample-$sample.log"
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rally-geometry-${{ matrix.input }}-${{ matrix.notebook }}
          path: rally-sample-*.log
          retention-days: 7
