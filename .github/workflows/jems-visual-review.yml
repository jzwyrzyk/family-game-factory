name: jems full visual review
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: jems-visual-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  selection:
    # This is an optional visual lane. Arcade still owns the required docs,
    # operations, provenance and aggregate checks for the same source.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      has-shards: ${{ steps.plan.outputs.has-shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select visual coverage using the trusted base policy
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/prepare-plan.mjs
      - name: Explain optional visual coverage
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('ci-plan.json', 'utf8'));
          const reason = plan.requiredShards.length
            ? 'Capture the page gallery. On PRs, consult the exact prospective merge Arcade studio-core and factory receipts for Brand, Studio, Delight and Gem Factory. Their status is reported independently. Manual dispatch also runs these four contracts here.'
            : 'The trusted base classifies this exact source as ' + plan.mode + '. Visual jobs are explicitly not required; release-intent reuse, when applicable, passed independent exact-evidence verification. Required documentation and operations checks remain in Arcade.';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n### Optional visual lane\n\n' + reason + '\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: visual-selection-${{ github.run_attempt }}
          path: ci-plan.json
          retention-days: 7
          if-no-files-found: error
  screenshots:
    needs: selection
    if: needs.selection.outputs.has-shards == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Build production
        run: npm run build
      - name: Capture all real jems pages
        id: pages
        run: node tests/brand-review-pages.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jems-page-by-page-review
          path: test-results/brand-review/
          if-no-files-found: error

      - name: Qualify all four gameplay and interaction contracts on manual dispatch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (steps.pages.outcome == 'success' || steps.pages.outcome == 'failure') }}
        run: |
          node --input-type=module <<'JS'
          import { runCommands } from './scripts/ci/run-suite.mjs';
          import { expandCommands, readJSON } from './scripts/ci/suites.mjs';
          const checks = ['node tests/brand-browser.cjs', 'node tests/studio-journey.cjs',
            'node tests/jems-delight-browser.cjs', 'npm run test:gem-factory'];
          const results = runCommands(expandCommands(checks, readJSON('package.json').scripts));
          if (results.some(result => result.exitCode !== 0)) process.exitCode = 1;
          JS
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        with:
          name: gem-factory-gameplay
          path: test-results/gem-factory/
          if-no-files-found: error
