name: Mind Your Jems art and gameplay review
on:
  pull_request:
    paths:
      - 'src/games/mind-your-jems*'
      - 'src/studio/ui.ts'
      - 'src/**/*.css'
      - 'public/art/mind-your-jems/**'
      - 'public/fonts/**'
      - 'public/jems*.svg'
      - 'tests/mind-your-jems*'
      - 'tests/visual/mind-your-jems/**'
      - 'tests/visual/mind-your-jems-native/**'
      - 'tests/browser-server.cjs'
      - 'tests/browser-scenarios*'
      - '.github/workflows/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tools/offline-build.ts'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mind-your-jems-shots-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - name: Check gameplay, responsive art and approved visual baselines
        run: node tests/mind-your-jems-browser.cjs
        env:
          MYJ_VISUAL_COMPARE: '1'
          MYJ_CAPTURE_VIDEO: '1'
      - name: Upload actual browser evidence and regression differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-your-jems-browser-screenshots
          path: test-results/mind-your-jems/
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact visual review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-your-jems-reference-review
          path: |
            test-results/mind-your-jems/manifest.json
            test-results/mind-your-jems/mind-your-jems-gameplay.webm
            test-results/mind-your-jems/desktop-idle.png
            test-results/mind-your-jems/desktop-warning.png
            test-results/mind-your-jems/desktop-ready.png
            test-results/mind-your-jems/tablet-portrait-idle.png
            test-results/mind-your-jems/tablet-portrait-warning.png
            test-results/mind-your-jems/tablet-portrait-ready.png
            test-results/mind-your-jems/mobile-idle.png
            test-results/mind-your-jems/mobile-warning.png
            test-results/mind-your-jems/mobile-ready.png
            test-results/mind-your-jems/desktop-help.png
            test-results/mind-your-jems/mobile-help.png
            test-results/mind-your-jems/mobile-landscape-small-help.png
          if-no-files-found: error
          retention-days: 14
