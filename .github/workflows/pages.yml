name: Build reviewed Pages site
# Deliberately manual. The code on main can advance without shipping any new feature.
# Every release selects one previously merged immutable source commit.
on:
  workflow_dispatch:
    inputs:
      delivery:
        description: Prepare a read-only package or publish the exact approved archive
        type: choice
        options: [prepare, prepare-retained, publish, rollback]
        default: prepare
      observation_run:
        description: Fresh protected three-service observation for publication or recovery
        type: string
        required: false
      source_sha:
        description: Exact reviewed 40-character merged Jems source SHA
        required: true
        type: string
      gateway_origin:
        description: Existing reviewed production gateway HTTPS origin
        required: true
        type: string
      preview_origin:
        description: Existing reviewed production preview HTTPS origin
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ startsWith(inputs.delivery, 'prepare') && format('jems-pages-prepare-{0}', github.run_id) || 'jems-cloud-run-production' }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'jzwyrzyk/family-game-factory' && github.ref == 'refs/heads/main' && github.ref_protected && (inputs.delivery == 'prepare' || (inputs.delivery == 'prepare-retained' && inputs.source_sha == 'aa56b60abe152e750f9f0b5e8949bdb44be53196'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      retained: ${{ steps.inventory.outputs.retained }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read current protected Pages delivery policy
        id: delivery
        run: python3 scripts/beta/pages-policy.py
      - name: Verify immutable merged application source and public destinations
        env:
          REVIEWED_SOURCE_SHA: ${{ inputs.source_sha }}
          FACTORY_PUBLIC_GATEWAY: ${{ inputs.gateway_origin }}
          FACTORY_PUBLIC_PREVIEW: ${{ inputs.preview_origin }}
        run: |
          set -euo pipefail
          if [[ ! "$REVIEWED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'A full reviewed source SHA is required; do not deploy a branch or mutable tag.'
            exit 1
          fi
          if ! git merge-base --is-ancestor "$REVIEWED_SOURCE_SHA" "$GITHUB_SHA"; then
            echo 'Requested source is not part of the triggering reviewed main history.'
            exit 1
          fi
          if [[ "$FACTORY_PUBLIC_GATEWAY" != "https://factory-gateway-ola734esta-ul.a.run.app" ||
                "$FACTORY_PUBLIC_PREVIEW" != "https://factory-preview-ola734esta-ul.a.run.app" ]]; then
            echo 'Both known production service origins must match exactly.'
            exit 1
          fi
          git checkout --detach "$REVIEWED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE_SHA"
          echo "Building reviewed application source $REVIEWED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        if: steps.delivery.outputs.mode == 'household'
      - name: Prepare the approved public-only retirement site
        if: steps.delivery.outputs.mode == 'welcome-only'
        env:
          APPROVED_HUB: ${{ steps.delivery.outputs.hub }}
          ADULT_CONTACT: ${{ steps.delivery.outputs.contact }}
          REVIEWED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node --import tsx scripts/beta/prepare-public.ts dist "$APPROVED_HUB" "$ADULT_CONTACT"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          allowed={'.nojekyll','index.html','404.html','entry.css','sw.js','welcome-assets/jems-logo.svg',
                   'welcome-assets/fonts/jems/Nunito-Variable.woff','welcome-assets/fonts/jems/Inter-Variable.woff'}
          allowed.update('welcome-assets/art/mind-your-jems/'+n+'.webp' for n in ('scene-sky','rock-expressions','miner-poses','cart-empty'))
          root=Path('dist')
          if any(p.is_symlink() for p in root.rglob('*')) or {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()} != allowed:
              raise SystemExit('PUBLIC_ASSET_INVENTORY_REJECTED')
          (root/'jems-release.json').write_text(json.dumps({'sourceSha':os.environ['REVIEWED_SOURCE_SHA'],'delivery':'welcome-only'})+'\n')
          PYTHON
      - name: Configure reviewed public service URLs
        if: steps.delivery.outputs.mode == 'household'
        run: node --import tsx scripts/deployment/site-config.ts
        env:
          FACTORY_PUBLIC_GATEWAY: ${{ inputs.gateway_origin }}
          FACTORY_PUBLIC_PREVIEW: ${{ inputs.preview_origin }}
      - name: Stamp immutable release source
        if: steps.delivery.outputs.mode == 'household'
        env:
          REVIEWED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = os.environ['REVIEWED_SOURCE_SHA']
          info = json.loads(Path('dist/build-info.json').read_text())
          if info.get('sha') != source or info.get('dirty') is not False:
              raise SystemExit('PAGES_BUILD_SOURCE_MISMATCH')
          Path('dist/jems-release.json').write_text(json.dumps({'sourceSha': source}) + '\n')
          print('PAGES_BUILD_SOURCE_VERIFIED=' + source)
          PY
      - name: Verify deployment provenance and all served files of the first recovery archive
        id: inventory
        if: inputs.delivery == 'prepare-retained'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SOURCE_SHA: ${{ inputs.source_sha }}
          DELIVERY_MODE: ${{ steps.delivery.outputs.mode }}
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:scripts/environments/retained_pages.py" > "$RUNNER_TEMP/retained-pages.py"
          python3 "$RUNNER_TEMP/retained-pages.py"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 30
  regressions:
    name: regression (${{ matrix.shard }})
    if: github.repository == 'jzwyrzyk/family-game-factory' && github.ref == 'refs/heads/main' && github.ref_protected && (inputs.delivery == 'prepare' || (inputs.delivery == 'prepare-retained' && inputs.source_sha == 'aa56b60abe152e750f9f0b5e8949bdb44be53196'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ["core", "learning", "gameplay", "browser-security", "generated", "creative", "studio", "coach"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable merged regression source and stage reviewed helper
        env:
          PREPARATION: ${{ inputs.delivery }}
          REVIEWED_SOURCE_SHA: ${{ inputs.source_sha }}
          FACTORY_PUBLIC_GATEWAY: ${{ inputs.gateway_origin }}
          FACTORY_PUBLIC_PREVIEW: ${{ inputs.preview_origin }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$REVIEWED_SOURCE_SHA" "$GITHUB_SHA"
          test "$FACTORY_PUBLIC_GATEWAY" = "https://factory-gateway-ola734esta-ul.a.run.app"
          test "$FACTORY_PUBLIC_PREVIEW" = "https://factory-preview-ola734esta-ul.a.run.app"
          # Forward selection always uses protected current policy. The one
          # finite recovery preparation replays that household's original eight full suites.
          # Tooling belongs to the reviewed dispatch commit; the application may
          # be any explicitly selected, reviewed ancestor of that commit.
          git show "$GITHUB_SHA:scripts/deployment/regressions.py" > "$RUNNER_TEMP/jems-regressions.py"
          if [[ "$PREPARATION" == prepare-retained ]]; then
            test "$REVIEWED_SOURCE_SHA" = aa56b60abe152e750f9f0b5e8949bdb44be53196
            git show cc3da7ef0cdd371f628f9bc51d32d6296f575f8e:scripts/deployment/regressions.py > "$RUNNER_TEMP/jems-regressions.py"
            echo "b1f6f36385b08195318c264427e5e51038b020284ba5cb1c477a90c14474c231  $RUNNER_TEMP/jems-regressions.py" | sha256sum -c -
          fi
          git checkout --detach "$REVIEWED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE_SHA"
          python3 "$RUNNER_TEMP/jems-regressions.py" --source . --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build selected production source
        run: npm run build
      - name: Browser and contract regression tests
        env:
          REGRESSION_SHARD: ${{ matrix.shard }}
        run: python3 "$RUNNER_TEMP/jems-regressions.py" --source . --shard "$REGRESSION_SHARD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-regression-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
  prepare-receipt:
    needs: [build, regressions]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.regressions.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SOURCE_SHA: ${{ inputs.source_sha }}
          RETAINED_INVENTORY: ${{ needs.build.outputs.retained }}
          PREPARATION: ${{ inputs.delivery }}
        run: python3 scripts/environments/pages_receipt.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/receipt.json
          retention-days: 30
          if-no-files-found: error
  approved-archive:
    environment: jems-production-evidence
    if: github.repository == 'jzwyrzyk/family-game-factory' && github.ref == 'refs/heads/main' && github.ref_protected && (inputs.delivery == 'publish' || inputs.delivery == 'rollback')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify reviewed release, exact archived site and live compatibility order
        env:
          GH_TOKEN: ${{ github.token }}
          JEMS_WORKER_REFS_READ_TOKEN: ${{ secrets.JEMS_WORKER_REFS_READ_TOKEN }}
          CHECK_MODE: ${{ inputs.delivery == 'rollback' && 'website-rollback' || 'website' }}
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          SERVING_RUN: ${{ inputs.observation_run }}
        run: python3 scripts/environments/production_gate.py "$CHECK_MODE" --observation "$SERVING_RUN" --website-source "$RELEASE_SOURCE" --out "$RUNNER_TEMP/artifact.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-website
          path: ${{ runner.temp }}/artifact.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: approved-archive
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      attestations: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recheck authenticated approval after the Pages environment gate
        env:
          GH_TOKEN: ${{ github.token }}
          JEMS_WORKER_REFS_READ_TOKEN: ${{ secrets.JEMS_WORKER_REFS_READ_TOKEN }}
          CHECK_MODE: ${{ inputs.delivery == 'rollback' && 'website-rollback' || 'website' }}
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          SERVING_RUN: ${{ inputs.observation_run }}
        run: python3 scripts/environments/production_gate.py "$CHECK_MODE" --observation "$SERVING_RUN" --website-source "$RELEASE_SOURCE"
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: approved-website
      - name: Confirm the public origin serves the selected marker
        env:
          RELEASE_SOURCE: ${{ inputs.source_sha }}
        run: python3 scripts/environments/verify_website.py
