name: Build reviewed Pages site
# Deliberately manual: PRs do not change the existing live arcade.
# Serialize with the new Jems controller; never race competing Pages artifacts.
concurrency:
  group: jems-pages-publish
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      gateway_origin:
        description: Existing gateway HTTPS origin; empty keeps AI unavailable
        required: false
        type: string
      preview_origin:
        description: Existing separate preview HTTPS origin
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Configure reviewed public service URLs
        run: node --import tsx scripts/deployment/site-config.ts
        env:
          FACTORY_PUBLIC_GATEWAY: ${{ inputs.gateway_origin }}
          FACTORY_PUBLIC_PREVIEW: ${{ inputs.preview_origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
