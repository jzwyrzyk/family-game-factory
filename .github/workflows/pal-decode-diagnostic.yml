name: Pal decode diagnostic

# Disposable evidence branch only. No dispatch, pull-request or main trigger.
on:
  push:
    branches: [debug/pal-decode-20261121]

permissions:
  contents: read

jobs:
  three-independent-attempts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Build unchanged production application
        run: npm run build
      - name: Collect three independent integrated Pal attempts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          memory_snapshot() {
            # Host/cgroup memory and executable names/RSS only; no args or env.
            free -k
            for metric in memory.current memory.peak memory.max memory.events; do
              if [ -r "/sys/fs/cgroup/$metric" ]; then
                printf '\n%s\n' "$metric"
                cat "/sys/fs/cgroup/$metric"
              fi
            done
            printf '\nChromium process command names and RSS (KiB)\n'
            ps -eo comm=,rss= | awk '$1 ~ /^(chrome|chromium|headless_shell|chrome-headless|chrome_crashpad)/ {print $1, $2}'
          }
          failed=0
          for attempt in 1 2 3; do
            evidence="test-results/pal-decode-attempt-${attempt}"
            mkdir -p "$evidence"
            memory_snapshot > "$evidence/memory-before.txt"
            # Each direct harness process launches its own fresh browser/context.
            # All three attempts run once; any failure keeps this job failed.
            status=0
            timeout 180s node tests/pals-browser.cjs > "$evidence/console.txt" 2>&1 || status=$?
            memory_snapshot > "$evidence/memory-after.txt"
            printf '{"attempt":%s,"exitCode":%s}\n' "$attempt" "$status" > "$evidence/attempt.json"
            cat "$evidence/console.txt"
            for result in test-results/pals-*; do
              if [ -f "$result" ]; then mv "$result" "$evidence/"; fi
            done
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pal-decode-diagnostic-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
