name: Parent reporting and dashboard

on:
  pull_request:
  push:
    branches: [main, 'feature/jems-parent-progress-*']

permissions:
  contents: read

concurrency:
  group: parent-reporting-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parent-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:parent-dashboard
      - run: npm run test:parent-dashboard-browser
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parent-dashboard-evidence
          path: test-results/
          retention-days: 7
