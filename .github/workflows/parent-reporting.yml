name: Parent reporting and dashboard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: parent-reporting-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parent-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:parent-dashboard
      - run: npm run test:parent-dashboard-browser
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parent-dashboard-evidence
          path: test-results/
          retention-days: 7
