name: Release regression contracts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/release-regression-contracts.yml'
      - 'scripts/deployment/regressions.py'
      - 'scripts/deployment/test_regressions.py'
      - 'scripts/deployment/test_pages_regressions.py'
      - 'package.json'
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/release-regression-contracts.yml'
      - 'scripts/deployment/regressions.py'
      - 'scripts/deployment/test_regressions.py'
      - 'scripts/deployment/test_pages_regressions.py'
      - 'package.json'
permissions:
  contents: read
# Validate each prospective PR merge once, then integrated main independently.
# Superseded runs still cancel within the same event and source branch.
concurrency:
  group: release-regression-contracts-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify complete test assignment and release failure paths
        run: python3 -m unittest discover -s scripts/deployment -p 'test_*regressions.py' -v
      - name: Check selected source against every required shard
        run: python3 scripts/deployment/regressions.py --check
