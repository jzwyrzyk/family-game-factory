name: Studio review source snapshot
on:
  push:
    branches: [feature/unified-studio-review]
    paths: [.github/workflows/studio-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Package lockfile-pinned dependencies only
        run: tar -czf studio-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: studio-dependencies-review
          path: studio-deps.tar.gz
          retention-days: 1
