name: Arcade journeys
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_full:
        description: Run every regression shard (manual runs always remain full)
        type: boolean
        default: true
      legacy_creative_shadow:
        description: Also run the complete original Creative chain for a migration benchmark
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
# Cancel only superseded validation of the same PR/main branch, never releases.
concurrency:
  group: arcade-journeys-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-shards: ${{ steps.plan.outputs.has-shards }}
      image: ${{ steps.plan.outputs.image }}
      mode: ${{ steps.plan.outputs.mode }}
      build-id: ${{ steps.build-upload.outputs.artifact-id }}
      build-digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prove complete coverage and failure-closed orchestration
        run: npm run test:ci
      - name: Classify exact source using trusted base policy
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          CI_FORCE_FULL: ${{ inputs.force_full || false }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/prepare-plan.mjs
      - name: Documentation integrity
        run: npm run docs:check
      - name: Operations, provenance and release-transition contracts
        run: npm run test:ops
      - name: Preserve selection and reuse explanations
        uses: actions/upload-artifact@v4
        if: always() && steps.plan.outcome == 'success'
        with:
          name: arcade-plan-${{ github.run_attempt }}
          path: |
            ci-plan.json
            ci-reuse.json
          retention-days: 30
          if-no-files-found: error
      - run: npm ci
        if: steps.plan.outputs.has-shards == 'true'
      - name: Build exact source once
        if: steps.plan.outputs.has-shards == 'true'
        run: npm run build
      - name: Bind complete production bundle to source and dependencies
        id: pack
        if: steps.plan.outputs.has-shards == 'true'
        run: node scripts/ci/build-artifact.mjs pack
      - uses: actions/upload-artifact@v4
        id: build-upload
        if: steps.plan.outputs.has-shards == 'true'
        with:
          name: arcade-build-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ci-build.tar
            ci-build.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  shards:
    name: shard (${{ matrix.shard }})
    needs: prepare
    if: needs.prepare.outputs.has-shards == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CI_BUILD_DIGEST: ${{ needs.prepare.outputs.build-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: chromium-ubuntu24-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
        if: steps.chromium.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.build-id }}
          merge-multiple: true
      - name: Verify immutable build bytes and exact source
        run: node scripts/ci/build-artifact.mjs verify
      - name: Run every assigned command once and preserve every failure
        env:
          CI_SHARD: ${{ matrix.shard }}
        run: node scripts/ci/run-suite.mjs "$CI_SHARD"
      - name: Save authoritative shard receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-receipt-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/ci/${{ matrix.shard }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Save browser and acceptance evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}
          compression-level: 0
          if-no-files-found: warn
  image-isolation:
    needs: prepare
    if: needs.prepare.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build dedicated isolated coach image
        run: docker build --file server/Dockerfile.coach --tag jems-private-coach:ci .
      - name: Prove inactive image starts and refuses inference
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh jems-private-coach:ci -c 'test ! -f /app/server/gateway.ts && test ! -d /app/src'
          id=$(docker run -d --rm -p 127.0.0.1:18080:8080 -e K_SERVICE=factory-coach-private -e FACTORY_COACH_EXECUTION_ENV=dedicated-cloud-run jems-private-coach:ci)
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          seen=0
          for i in $(seq 1 25); do
            code=$(curl -s --output /dev/null --write-out '%{http_code}' --max-time 2 -X POST http://127.0.0.1:18080/v1/private-coach/complete || true)
            if [ "$code" = "403" ]; then seen=1; break; fi
            sleep 1
          done
          test "$seen" = "1"
          test "$(docker inspect --format '{{.State.Running}}' "$id")" = "true"
  browser:
    # Stable required check. Missing/cancelled/failed selected shards fail closed.
    needs: [prepare, shards, image-isolation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: arcade-plan-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.has-shards == 'true'
        with:
          pattern: ci-receipt-${{ github.run_attempt }}-*
          path: ci-receipts
      - name: Require exact planned receipts and successful jobs
        env:
          CI_PREPARE_RESULT: ${{ needs.prepare.result }}
          CI_SHARDS_RESULT: ${{ needs.shards.result }}
          CI_IMAGE_RESULT: ${{ needs.image-isolation.result }}
          CI_BUILD_DIGEST: ${{ needs.prepare.outputs.build-digest }}
        run: node scripts/ci/aggregate.mjs browser
  learning:
    # Stable required check. Missing/cancelled/failed selected shards fail closed.
    needs: [prepare, shards, image-isolation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: arcade-plan-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.has-shards == 'true'
        with:
          pattern: ci-receipt-${{ github.run_attempt }}-*
          path: ci-receipts
      - name: Require exact planned receipts and successful jobs
        env:
          CI_PREPARE_RESULT: ${{ needs.prepare.result }}
          CI_SHARDS_RESULT: ${{ needs.shards.result }}
          CI_IMAGE_RESULT: ${{ needs.image-isolation.result }}
          CI_BUILD_DIGEST: ${{ needs.prepare.outputs.build-digest }}
        run: node scripts/ci/aggregate.mjs learning
  creative:
    # Stable required check. Missing/cancelled/failed selected shards fail closed.
    needs: [prepare, shards, image-isolation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: arcade-plan-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.has-shards == 'true'
        with:
          pattern: ci-receipt-${{ github.run_attempt }}-*
          path: ci-receipts
      - name: Require exact planned receipts and successful jobs
        env:
          CI_PREPARE_RESULT: ${{ needs.prepare.result }}
          CI_SHARDS_RESULT: ${{ needs.shards.result }}
          CI_IMAGE_RESULT: ${{ needs.image-isolation.result }}
          CI_BUILD_DIGEST: ${{ needs.prepare.outputs.build-digest }}
        run: node scripts/ci/aggregate.mjs creative
  notifications:
    # Stable required check. Missing/cancelled/failed selected shards fail closed.
    needs: [prepare, shards, image-isolation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: arcade-plan-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.has-shards == 'true'
        with:
          pattern: ci-receipt-${{ github.run_attempt }}-*
          path: ci-receipts
      - name: Require exact planned receipts and successful jobs
        env:
          CI_PREPARE_RESULT: ${{ needs.prepare.result }}
          CI_SHARDS_RESULT: ${{ needs.shards.result }}
          CI_IMAGE_RESULT: ${{ needs.image-isolation.result }}
          CI_BUILD_DIGEST: ${{ needs.prepare.outputs.build-digest }}
        run: node scripts/ci/aggregate.mjs notifications
  private-coach-image:
    # Stable required check. Missing/cancelled/failed selected shards fail closed.
    needs: [prepare, shards, image-isolation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: arcade-plan-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.has-shards == 'true'
        with:
          pattern: ci-receipt-${{ github.run_attempt }}-*
          path: ci-receipts
      - name: Require exact planned receipts and successful jobs
        env:
          CI_PREPARE_RESULT: ${{ needs.prepare.result }}
          CI_SHARDS_RESULT: ${{ needs.shards.result }}
          CI_IMAGE_RESULT: ${{ needs.image-isolation.result }}
          CI_BUILD_DIGEST: ${{ needs.prepare.outputs.build-digest }}
        run: node scripts/ci/aggregate.mjs private-coach-image
  validation-evidence:
    needs: [prepare, shards, image-isolation, browser, learning, creative, notifications, private-coach-image]
    # PR/manual receipts exercise this path, but the independent verifier accepts
    # only completed successful first-attempt main-push runs as reusable evidence.
    if: github.run_attempt == 1 && needs.prepare.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.build-id }}
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-receipt-${{ github.run_attempt }}-*
          path: ci-receipts
      - name: Bind full validation to candidate identity
        run: node scripts/ci/validation-evidence.mjs create ci-receipts
      - uses: actions/upload-artifact@v4
        with:
          name: arcade-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: validation-evidence.json
          retention-days: 30
          if-no-files-found: error
  legacy-creative-shadow:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_creative_shadow
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI_BUILD_DIGEST: ${{ needs.prepare.outputs.build-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.build-id }}
          merge-multiple: true
      - run: node scripts/ci/build-artifact.mjs verify
      - name: Original Creative order with unchanged assertions
        run: node scripts/ci/run-suite.mjs legacy-creative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-creative-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
