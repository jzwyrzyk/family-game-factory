name: Arcade journeys
on: [push, pull_request]
# Push and PR workflows from the same source branch share one latest-head run.
# Do not spend runners on superseded commits during rapid review iterations.
concurrency:
  group: arcade-journeys-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  private-coach-image:
    # No provider key, cloud identity or funded API endpoint is available here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dedicated isolated coach image
        run: docker build --file server/Dockerfile.coach --tag jems-private-coach:ci .
      - name: Prove inactive image starts and refuses inference
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh jems-private-coach:ci -c 'test ! -f /app/server/gateway.ts && test ! -d /app/src'
          id=$(docker run -d --rm -p 127.0.0.1:18080:8080 -e K_SERVICE=factory-coach-private -e FACTORY_COACH_EXECUTION_ENV=dedicated-cloud-run jems-private-coach:ci)
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          seen=0
          for i in $(seq 1 25); do
            code=$(curl -s --output /dev/null --write-out '%{http_code}' --max-time 2 -X POST http://127.0.0.1:18080/v1/private-coach/complete || true)
            if [ "$code" = "403" ]; then seen=1; break; fi
            sleep 1
          done
          test "$seen" = "1"
          test "$(docker inspect --format '{{.State.Running}}' "$id")" = "true"
  browser:
    # Playwright 1.56.1 supports Ubuntu 24.04; ubuntu-latest can move to unsupported OS versions.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Build production
        id: build
        run: npm run build
      # These suites are independent once the production bundle exists. Preserve
      # every failure while still collecting the rest of the required evidence.
      - name: Unit and contract checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:unit
      - name: Deployment configuration checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:deployment
      - name: Arcade journey
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/journeys.cjs
      - name: Live remix journey
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/live-remix.cjs
      - name: Builder journey
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --import tsx tests/builder-browser.ts
      - name: Build actions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --import tsx tests/actions-e2e.ts
      - name: Independent intent gameplay browser tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:intent-playtest
      - name: Repair and retest in existing sandbox worker
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:intent-repair-browser
      - name: Generated worker security
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --import tsx tests/generated-worker-security.ts
      - name: Approved artwork and archived runtime compatibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:generated-art
      - name: Actual normal-motion review captures and input receipts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:quality-capture
      - name: Restored games
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/restored-games.cjs
      - name: Offline shell
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/offline-shell.cjs
      - name: Construction touch controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/construction-touch.cjs
      - name: Private drawings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/private-drawings.cjs
      - name: Real agent activation status
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:real-agent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
  learning:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Build production
        id: build
        run: npm run build
      - name: Learning activities
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:learning-ui
      - name: Learning integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:learning-integration
      - name: Language activities
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:language-ui
      - name: Language subject integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:language-integration
      - name: Learning persistence and pacing
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/learning-repair.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-evidence
          path: test-results/
          if-no-files-found: ignore
  creative:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Build production
        id: build
        run: npm run build
      - name: Physical and generated games
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:quality
      - name: Studio journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:studio
      - name: Editable creation contracts and behavioral challenges
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:creation
      - name: Creation desktop and touch journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:creation-browser
      - name: Design coach checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:coach
      - name: Child journey and recovery
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:child-journey
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-evidence
          path: test-results/
          if-no-files-found: ignore
