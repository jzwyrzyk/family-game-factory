name: Trusted family device security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  auth-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck gateway and client
        run: npm run typecheck
      - name: Full unit and contract compatibility
        run: npm run test:unit
      - name: Trusted-device revocation, rotation and parent security
        run: node --import tsx tests/trusted-devices.test.ts
      - name: Browser-session renewal and paid POST idempotency
        run: node --import tsx tests/session-client.test.ts
      - name: Private family beta isolation and authorization
        run: node --import tsx --test tests/beta-*.test.ts
      - name: Build private application and separately scoped feature files
        run: npm run build:family-beta
      - name: Prepare browsers for synthetic family journeys
        run: npx playwright install --with-deps chromium webkit
      - name: Chromium and WebKit private entry and responsive acceptance
        run: node --import tsx tests/beta-browser.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: private-family-synthetic-layouts-${{ github.sha }}
          path: test-results/family-beta/*.png
          retention-days: 7
