name: Standalone UI review
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'tools/ui-review/**', 'tests/parent-dashboard-fixture.ts', 'package*.json', '.github/workflows/ui-review.yml']
  pull_request:
    paths: ['src/**', 'public/**', 'index.html', 'tools/ui-review/**', 'docs/ui-review/**', 'tests/parent-dashboard-fixture.ts', 'package*.json', '.github/workflows/ui-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install Pillow==11.3.0
      - name: Identify exact represented candidate or main source
        shell: bash
        run: echo "UI_REVIEW_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: npm run design:check && npm run design:test
      - run: npm run review:build
        env:
          UI_REVIEW_SOURCE_KIND: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'merged main' || 'candidate branch' }}
          UI_REVIEW_EXACT_ASSETS: '1'
      - name: Build focused My Art download
        run: node tools/ui-review/build.mjs --drawing
        env:
          UI_REVIEW_SOURCE_KIND: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'merged main' || 'candidate branch' }}
          UI_REVIEW_EXACT_ASSETS: '1'
      - name: Compare every bundled public resource with the checked out source
        run: python tools/ui-review/verify-exact-assets.py . dist-review/exact-source-artifact.json
      - name: Upload the standalone download
        id: download
        uses: actions/upload-artifact@v4
        with:
          name: jems-ui-review-${{ env.UI_REVIEW_BASE_SHA }}
          path: dist-review/
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
      - name: Open the interactive review while browser qualification runs
        env:
          ARTIFACT_URL: ${{ steps.download.outputs.artifact-url }}
          CHANGE_URL: ${{ github.event.pull_request.html_url || github.event.compare || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
        run: |
          echo "::notice title=Offline review available for $UI_REVIEW_BASE_SHA::$ARTIFACT_URL"
          {
            echo '### Available for interactive review'
            echo
            echo "[Download the HTML]($ARTIFACT_URL) · [Inspect the changes]($CHANGE_URL)"
            echo
            echo "Represented source: $UI_REVIEW_BASE_SHA. The offline build and upload completed."
            echo 'Open jems-ui-review.html with synthetic data. Browser journeys and hosted checks are pending at upload. Visible changes still require owner acceptance and the applicable private DEV and TEST gates.'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npx playwright install --with-deps chromium
      - run: npm run review:test
      - name: Check retained picker, legacy worlds, landscape pixels and recorded output
        run: |
          node tools/ui-review/creative-picker.cjs
          node tools/ui-review/notebook-game.cjs
          node tools/ui-review/world-compatibility.cjs
          node tools/ui-review/connected-learning.cjs
      - name: Open the drawing download, save, reload and keep a new version
        run: node tools/ui-review/drawing-smoke.cjs
      - name: Capture complete candidate journeys
        run: npm run build && npm run test:child-modernization && npm run test:pals-fidelity && node tests/pals-fidelity-browser.cjs --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jems-ui-review-evidence-${{ env.UI_REVIEW_BASE_SHA }}
          path: |
            test-results/ui-review/
            test-results/design-system/
            test-results/child-modernization/
            test-results/pal-fidelity/
          retention-days: 14
          compression-level: 6
